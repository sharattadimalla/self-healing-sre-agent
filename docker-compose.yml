# Self-Healing SRE Agent — full demo stack.
# traefik, api, db, otel-collector, jaeger, prometheus, grafana + agent, locust.
#
#   make up            # docker compose up --build -d --scale api=2
#   make scenario-errors | scenario-traffic | scenario-latency

name: sre-demo

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orders}:${POSTGRES_PASSWORD:-orders}@db:5432/${POSTGRES_DB:-orders}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: api
  STATE_PATH: /state/state.json
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
  RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}

services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    depends_on:
      - api

  api:
    build: ./api
    restart: unless-stopped
    # No container_name — scale with `--scale api=N`.
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits:
          # Deliberately tight so the traffic-spike scenario actually saturates:
          # under the 10▶300 ramp, CPU starvation drives p95 from ~95ms to
          # ~600ms+ while throughput runs several× baseline. Scaling out to 4
          # replicas restores headroom.
          cpus: "${API_CPUS:-0.35}"
          memory: 512M
    environment:
      <<: *api-env
    volumes:
      - fault-state:/state
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orders} -d ${POSTGRES_DB:-orders}"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    # root so docker_sd can read the mounted docker socket (Docker Desktop owns
    # it root:root; the image's default `nobody` user gets EACCES).
    user: root
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  agent:
    build: ./agent
    restart: unless-stopped
    environment:
      AGENT_PROMETHEUS_URL: http://prometheus:9090
      AGENT_JAEGER_URL: http://jaeger:16686
      AGENT_API_BASE_URL: http://traefik:80
      AGENT_ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      AGENT_COMPOSE_PROJECT: sre-demo
      AGENT_COMPOSE_FILE: /workspace/docker-compose.yml
      AGENT_API_SERVICE: api
      AGENT_MIN_REPLICAS: ${API_REPLICAS:-2}
      AGENT_MAX_REPLICAS: ${AGENT_MAX_REPLICAS:-6}
      AGENT_POLL_INTERVAL_SECONDS: ${AGENT_POLL_INTERVAL_SECONDS:-10}
      AGENT_VERIFY_COOLDOWN_SECONDS: ${AGENT_VERIFY_COOLDOWN_SECONDS:-55}
      AGENT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      AGENT_SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      # The agent shells out to `docker compose` against the host daemon, so it
      # needs the socket and the repo (relative build contexts + this file).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    ports:
      - "${AGENT_UI_PORT:-8000}:8000"
    depends_on:
      - prometheus
      - jaeger
      - traefik

  locust:
    image: locustio/locust:2.31.8
    restart: unless-stopped
    volumes:
      - ./load:/mnt/locust:ro
    environment:
      LOCUST_SCENARIO: ${LOCUST_SCENARIO:-baseline}
    command: >-
      -f /mnt/locust/locustfile.py
      --host http://traefik:80
    ports:
      - "${LOCUST_WEB_PORT:-8089}:8089"
    depends_on:
      - traefik

volumes:
  pgdata:
  fault-state:
