[project]
name = "sre-demo-agent"
version = "0.1.0"
description = "LangGraph self-healing SRE agent for the demo stack"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.40",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.nodes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
