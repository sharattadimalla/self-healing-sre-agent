# Static configuration. Dynamic config comes from Docker labels on `api`.
entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

api:
  dashboard: true
  insecure: true   # dashboard on :8080 — demo only

providers:
  docker:
    exposedByDefault: false
    watch: true

metrics:
  prometheus:
    entryPoint: traefik
    addEntryPointsLabels: true
    addServicesLabels: true

log:
  level: INFO
accessLog: {}
